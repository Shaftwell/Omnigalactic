<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Omnigalactic</title>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Omnigalactic" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#020617" />
    <style>
      /* Boot splash: shown instantly, replaced when React mounts */
      html { background: #020617; }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 80% 50% at 20% -10%, rgba(67, 56, 202, 0.28), transparent 60%),
          radial-gradient(ellipse 70% 50% at 85% 110%, rgba(109, 40, 217, 0.18), transparent 60%),
          #020617;
      }
      #boot-splash::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        box-shadow:
          12vw 18vh 0 rgba(255,255,255,0.8), 78vw 12vh 0 rgba(199,210,254,0.7),
          42vw 82vh 0 rgba(255,255,255,0.9), 88vw 68vh 0 rgba(255,255,255,0.6),
          24vw 58vh 0 rgba(186,230,253,0.5), 64vw 38vh 0 rgba(255,255,255,0.8),
          16vw 88vh 0 rgba(255,255,255,0.6), 55vw 8vh 0 rgba(255,255,255,0.9),
          32vw 28vh 0 rgba(255,255,255,0.5), 92vw 32vh 0 rgba(254,240,138,0.6),
          7vw 45vh 0 rgba(255,255,255,0.7), 70vw 90vh 0 rgba(199,210,254,0.6);
      }
      #boot-splash .ring {
        width: 48px;
        height: 48px;
        border: 4px solid #6366f1;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash"><div class="ring"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
